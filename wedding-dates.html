<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wedding Date Notes</title>
<style>
:root{--bg:#faf6f1;--card:#fff;--tx:#2a2220;--mut:#7a6d66;--ac:#b5483a;--ac2:#f3e2dc;--bd:#e6dcd3;--ok:#2f7d4f;--warn:#c27a00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1816;--card:#26201e;--tx:#f1e9e4;--mut:#a89a92;--ac:#e07a68;--ac2:#3a2824;--bd:#3a312d;--ok:#6cc08a;--warn:#e8b04a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1816;--card:#26201e;--tx:#f1e9e4;--mut:#a89a92;--ac:#e07a68;--ac2:#3a2824;--bd:#3a312d;--ok:#6cc08a;--warn:#e8b04a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
.wrap{max-width:640px;margin:0 auto;padding:16px}
.brand{display:flex;flex-direction:column;align-items:center;padding:12px;margin-bottom:8px;background:var(--card);border:1px solid var(--bd);border-radius:14px}
.brand img{width:150px;max-width:60%;height:auto}.bh{font-size:12px;color:var(--mut);margin-top:2px}.bn{font-weight:700;letter-spacing:.3px}.bh{font-size:12px;opacity:.85}
.sync{font-size:12px;color:var(--warn);white-space:nowrap}.sync.on{color:var(--ok)}
a.btn{display:inline-block;text-decoration:none;font-size:13px;padding:6px 10px;border-radius:10px;background:var(--ac2);color:var(--ac);font-weight:600}
h1{font-size:22px;margin:8px 0 2px}
.sub{color:var(--mut);font-size:14px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;font-size:16px}
textarea{min-height:64px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px 16px;background:var(--ac);color:#fff;font-weight:600}
button.ghost{background:var(--ac2);color:var(--ac)}
button.sm{padding:6px 10px;font-size:13px}
.full{width:100%;margin-top:14px}
#warn{display:none;color:var(--warn);font-size:14px;margin-top:8px}
.stats{display:flex;gap:8px;margin-bottom:12px}
.stat{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px;color:var(--ac)}
.stat span{font-size:12px;color:var(--mut)}
.item{border-left:4px solid var(--ac);}
.item.past{border-left-color:var(--bd);opacity:.7}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.date{font-weight:700}
.badge{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--ac2);color:var(--ac);white-space:nowrap}
.meta{font-size:14px;color:var(--mut);margin-top:4px;word-break:break-word}
.acts{display:flex;gap:8px;margin-top:10px}
.empty{text-align:center;color:var(--mut);padding:20px}
</style>
</head>

  <h1>Wedding Date Notes</h1>
  <p class="sub">Shaadi ki dates aur booking details yahan note karein. <span id="sync" class="sync">● Is device par</span></p>

  <div class="stats">
    <div class="stat"><b id="sTotal">0</b><span>Total</span></div>
    <div class="stat"><b id="sUp">0</b><span>Upcoming</span></div>
    <div class="stat"><b id="sNext">–</b><span>Agli date</span></div>
  </div>

  <div class="card">
    <input type="hidden" id="eid">
    <label for="date">Wedding date *</label>
    <input type="date" id="date">
    <div id="warn">⚠️ Is date par pehle se booking hai!</div>
    <label for="name">Client / Couple ka naam *</label>
    <input id="name" placeholder="e.g. Rahul &amp; Priya">
    <div class="row">
      <div><label for="phone">Phone</label><input id="phone" type="tel" inputmode="tel"></div>
      <div><label for="venue">Venue / Jagah</label><input id="venue"></div>
    </div>
    <div class="row">
      <div><label for="total">Total amount (₹)</label><input id="total" type="number" inputmode="numeric"></div>
      <div><label for="adv">Advance (₹)</label><input id="adv" type="number" inputmode="numeric"></div>
    </div>
    <label for="note">Note</label>
    <textarea id="note" placeholder="Package, ritual dates, special demand..."></textarea>
    <button class="full" id="save">Save karein</button>
    <button class="full ghost" id="cancel" style="display:none">Edit cancel karein</button>
  </div>

  <input id="q" placeholder="🔍 Naam ya venue se search karein" style="margin-bottom:12px">
  <div id="list"></div>
  <button class="ghost full" id="copy">Sab notes copy karein (backup)</button>
  <p class="sub" style="margin-top:10px">Data sirf isi phone/browser mein save hota hai. Time-time par backup copy kar lein.</p>
</div>
<script>
const KEY='wedding-dates-v1';
let items=[],col=null;
const $=id=>document.getElementById(id);
function loadLocal(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')||[]}catch(e){return[]}}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}}
async function persistRec(rec){
  const ix=items.findIndex(i=>i.id===rec.id);
  if(col){try{await col.doc(rec.id).set(rec);return}catch(e){alert('Cloud save nahi hua, is device par save kiya.')}}
  if(ix>=0)items[ix]=rec;else items.push(rec);saveLocal();render();
}
async function removeRec(id){
  if(col){try{await col.doc(id).delete();return}catch(e){alert('Delete nahi hua.');return}}
  items=items.filter(i=>i.id!==id);saveLocal();render();
}
async function initDb(){
  try{
    const db=await claude.use('db');
    if(!db)return;
    col=db.collection('weddings');
    let migrated=false;
    col.onSnapshot(snap=>{
      items=snap.docs.map(d=>({id:d.id,...d.data()}));
      $('sync').textContent='● Sab devices par sync';$('sync').className='sync on';
      render();
      if(!migrated){migrated=true;const loc=loadLocal();
        loc.filter(l=>!items.some(i=>i.id===l.id)).forEach(l=>col.doc(l.id).set(l).catch(()=>{}));
        if(loc.length){try{localStorage.removeItem(KEY)}catch(e){}}}
    },()=>{});
  }catch(e){}
}
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const fmt=s=>new Date(s+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
function wa(i){let p=String(i.phone||'').replace(/\D/g,'');if(p.length===10)p='91'+p;
  const m=`Namaste ${i.name}! The Wedding Cine Frame ki taraf se yaad dila rahe hain: aapki shaadi ${fmt(i.date)}${i.venue?' ('+i.venue+')':''} ko hai. Koi sawal ho to batayein. 🎬`;
  return 'https://wa.me/'+p+'?text='+encodeURIComponent(m)}
function cal(i){const d=i.date.replace(/-/g,''),n=new Date(i.date+'T00:00:00');n.setDate(n.getDate()+1);
  const e=n.getFullYear()+String(n.getMonth()+1).padStart(2,'0')+String(n.getDate()).padStart(2,'0');
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent('Wedding shoot: '+i.name)+'&dates='+d+'/'+e+'&location='+encodeURIComponent(i.venue||'')+'&details='+encodeURIComponent((i.note||'')+(i.phone?'\nPhone: '+i.phone:''))}
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function daysLeft(s){return Math.round((new Date(s+'T00:00:00')-today())/864e5)}
function checkClash(){
  const d=$('date').value,id=$('eid').value;
  $('warn').style.display=(d&&items.some(i=>i.date===d&&i.id!==id))?'block':'none';
}
function render(){
  const q=$('q').value.trim().toLowerCase();
  const sorted=[...items].sort((a,b)=>a.date.localeCompare(b.date));
  const up=sorted.filter(i=>daysLeft(i.date)>=0);
  $('sTotal').textContent=items.length;
  $('sUp').textContent=up.length;
  $('sNext').textContent=up.length?(daysLeft(up[0].date)===0?'Aaj':daysLeft(up[0].date)+' din'):'–';
  const shown=sorted.filter(i=>!q||(i.name+' '+i.venue).toLowerCase().includes(q));
  const upS=shown.filter(i=>daysLeft(i.date)>=0),pastS=shown.filter(i=>daysLeft(i.date)<0).reverse();
  const card=i=>{
    const n=daysLeft(i.date),past=n<0;
    const bal=(Number(i.total)||0)-(Number(i.adv)||0);
    return `<div class="card item ${past?'past':''}"><div class="top"><div><div class="date">${fmt(i.date)}</div><div>${esc(i.name)}</div></div>
    <span class="badge">${past?'Ho chuki':n===0?'Aaj':n+' din baaki'}</span></div>
    <div class="meta">${i.venue?'📍 '+esc(i.venue)+'<br>':''}${i.phone?'📞 <a href="tel:'+esc(i.phone)+'" style="color:inherit">'+esc(i.phone)+'</a><br>':''}${i.total?'💰 ₹'+i.total+' | Advance ₹'+(i.adv||0)+' | Baaki ₹'+bal+'<br>':''}${i.note?'📝 '+esc(i.note):''}</div>
    <div class="acts">${i.phone&&!past?'<a class="btn" target="_blank" rel="noopener" href="'+wa(i)+'">WhatsApp</a>':''}${!past?'<a class="btn" target="_blank" rel="noopener" href="'+cal(i)+'">Calendar</a>':''}<button class="sm ghost" onclick="edit('${i.id}')">Edit</button><button class="sm ghost" onclick="del('${i.id}')">Delete</button></div></div>`;
  };
  $('list').innerHTML=(upS.length?upS.map(card).join(''):'')+(pastS.length?'<p class="sub">Purani dates</p>'+pastS.map(card).join(''):'')||'<div class="empty">Abhi koi date save nahi hai.</div>';
}
function reset(){['eid','date','name','phone','venue','total','adv','note'].forEach(k=>$(k).value='');$('save').textContent='Save karein';$('cancel').style.display='none';$('warn').style.display='none'}
$('save').onclick=()=>{
  const d=$('date').value,n=$('name').value.trim();
  if(!d||!n){alert('Date aur naam zaroori hain.');return}
  const rec={id:$('eid').value||String(Date.now()),date:d,name:n,phone:$('phone').value.trim(),venue:$('venue').value.trim(),total:$('total').value,adv:$('adv').value,note:$('note').value.trim()};
  persistRec(rec);reset();
};
$('cancel').onclick=reset;
$('date').oninput=checkClash;
$('q').oninput=render;
window.edit=id=>{const i=items.find(x=>x.id===id);if(!i)return;
  $('eid').value=i.id;['date','name','phone','venue','total','adv','note'].forEach(k=>$(k).value=i[k]||'');
  $('save').textContent='Update karein';$('cancel').style.display='block';checkClash();window.scrollTo({top:0,behavior:'smooth'})};
window.del=id=>{if(confirm('Ye entry delete karein?'))removeRec(id)};
$('copy').onclick=async()=>{
  const t=[...items].sort((a,b)=>a.date.localeCompare(b.date)).map(i=>`${i.date} | ${i.name} | ${i.venue||'-'} | ${i.phone||'-'} | ₹${i.total||0} (adv ₹${i.adv||0}) | ${i.note||''}`).join('\n');
  try{await navigator.clipboard.writeText(t);alert('Copy ho gaya!')}catch(e){prompt('Ye text copy karein:',t)}
};
items=loadLocal();render();initDb();
</script>
</body>
</html>
